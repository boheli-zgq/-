<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciTools Hub</title>
    <!-- 引入 Tailwind CSS (解决样式丢失问题) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 定义 Tailwind 扩展配置 -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              science: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    
    <!-- Load UTIF.js globally for better compatibility with TIFF files -->
    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>

    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-800">
    <!-- React 挂载点 -->
    <div id="root" class="flex items-center justify-center min-h-screen text-slate-400">Loading SciTools Hub...</div>

    <!-- 打赏功能 HTML (原生实现，独立于 React) -->
    <!-- 1. 悬浮组件 (New Design) -->
    <div id="support-btn" class="support-widget group" role="button" aria-label="欢迎打赏">
        <div class="widget-icon">
            <span class="emoji">☕</span>
        </div>
        <div class="widget-content">
            <div class="widget-title">欢迎打赏</div>
            <div class="widget-subtitle">助力工具持续更新</div>
        </div>
        <div class="widget-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
    </div>

    <!-- 2. 模态框 -->
    <div id="donation-modal" class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close-btn" id="close-modal">&times;</button>
            <div class="modal-header">
                <h3>支持我们</h3>
                <p>如果这些工具对您的科研有帮助，欢迎打赏一杯咖啡！</p>
            </div>
            <div class="payment-tabs">
                <button class="tab-btn active" data-target="wechat">
                    <span class="dot wechat-dot"></span>微信支付
                </button>
                <button class="tab-btn" data-target="alipay">
                    <span class="dot alipay-dot"></span>支付宝
                </button>
            </div>
            <div class="qr-content-wrapper">
                <div id="wechat" class="qr-panel active">
                    <div class="qr-frame">
                        <img 
                            src="https://raw.githubusercontent.com/boheli-zgq/picture/main/wechat-pay.jpg" 
                            alt="WeChat Pay QR Code"
                            onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'flex items-center justify-center h-full bg-slate-100 text-slate-400 text-xs p-4 text-center\'>图片加载失败<br>请检查网络连接</div>'"
                        >
                    </div>
                    <p class="qr-tip">打开微信扫一扫</p>
                </div>
                <div id="alipay" class="qr-panel">
                    <div class="qr-frame">
                        <img 
                            src="https://raw.githubusercontent.com/boheli-zgq/picture/main/alipay.jpg" 
                            alt="Alipay QR Code"
                            onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'flex items-center justify-center h-full bg-slate-100 text-slate-400 text-xs p-4 text-center\'>图片加载失败<br>请检查网络连接</div>'"
                        >
                    </div>
                    <p class="qr-tip">打开支付宝扫一扫</p>
                </div>
            </div>
            <div class="modal-footer">
                <p>祝您科研顺利，多发 Paper！🎓</p>
            </div>
        </div>
    </div>

    <!-- 打赏功能样式 -->
    <style>
    :root {
        --bg-overlay: rgba(255, 255, 255, 0.6);
        --modal-bg: #ffffff;
        --text-main: #37352f;
        --text-sub: #787774;
        --accent-color: #2e2e2e;
        --border-color: #e0e0e0;
        --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.08);
        --shadow-card: 0 10px 40px -10px rgba(0, 0, 0, 0.15);
        --wechat-green: #09bb07;
        --alipay-blue: #1677ff;
    }

    /* Support Widget Styles */
    .support-widget {
        position: fixed;
        bottom: 32px;
        right: 32px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 16px 20px;
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        border: 1px solid rgba(255, 255, 255, 0.8);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 1000;
        max-width: 300px;
    }

    .support-widget:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.2);
        border-color: #fff;
    }

    .widget-icon {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #fdfbf7 0%, #f3f0e8 100%);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 2px 6px rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.03);
    }

    .widget-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2px;
        text-align: center;
    }

    .widget-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: -0.01em;
    }

    .widget-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
    }

    .widget-arrow {
        color: #cbd5e1;
        transition: transform 0.3s ease, color 0.3s ease;
    }

    .support-widget:hover .widget-arrow {
        color: #6366f1; /* Indigo 500 */
        transform: translateX(4px);
    }

    /* Modal Styles */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }

    .modal-container {
        background: var(--modal-bg);
        width: 380px;
        max-width: 90%;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        position: relative;
        transform: scale(0.95) translateY(10px);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .modal-overlay.show .modal-container { transform: scale(1) translateY(0); }

    .modal-close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        background: #f8fafc;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 20px;
        color: var(--text-sub);
        cursor: pointer;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .modal-close-btn:hover { background: #e2e8f0; color: var(--text-main); transform: rotate(90deg); }

    .modal-header h3 { margin: 0 0 8px 0; font-size: 22px; color: var(--text-main); font-weight: 800; letter-spacing: -0.02em; }
    .modal-header p { margin: 0 0 24px 0; font-size: 14px; color: var(--text-sub); line-height: 1.5; }

    .payment-tabs {
        display: flex;
        background: #f1f5f9;
        padding: 4px;
        border-radius: 12px;
        margin-bottom: 24px;
    }
    .tab-btn {
        flex: 1;
        border: none;
        background: transparent;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .tab-btn:hover { color: #334155; }
    .tab-btn.active { background: #fff; color: #0f172a; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; opacity: 0.5; transition: opacity 0.2s; }
    .active .dot { opacity: 1; }
    .wechat-dot { background-color: var(--wechat-green); }
    .alipay-dot { background-color: var(--alipay-blue); }

    .qr-content-wrapper { min-height: 260px; }
    .qr-panel { display: none; animation: fadeIn 0.4s ease; }
    .qr-panel.active { display: block; }
    .qr-frame {
        width: 240px;
        height: 240px;
        margin: 0 auto;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        background: #fff;
        padding: 8px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .qr-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .qr-tip { font-size: 13px; color: #94a3b8; margin-top: 16px; font-weight: 500; }

    .modal-footer { margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
    .modal-footer p { font-size: 13px; color: #64748b; margin: 0; font-weight: 500; }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 480px) {
        .support-widget { bottom: 20px; right: 20px; padding: 12px 16px; max-width: auto; }
        .widget-icon { width: 40px; height: 40px; font-size: 20px; }
        .widget-title { font-size: 14px; }
        .widget-subtitle { display: none; }
    }
    </style>

    <!-- 打赏功能交互逻辑 -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const supportBtn = document.getElementById('support-btn');
        const modal = document.getElementById('donation-modal');
        const closeBtn = document.getElementById('close-modal');
        const tabs = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.qr-panel');

        if (supportBtn) {
            supportBtn.addEventListener('click', () => {
                modal.classList.add('show');
            });
        }
        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('show');
            });
        }
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });
        }
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                const targetId = tab.getAttribute('data-target');
                const targetPanel = document.getElementById(targetId);
                if (targetPanel) {
                    targetPanel.classList.add('active');
                }
            });
        });
    });
    </script>
    
    <!-- React 入口脚本 -->
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
